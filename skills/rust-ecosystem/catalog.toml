# rustkb crate catalog: machine-read by the rustkb MCP server (recommend_crates, crate_info),
# drift detection (rustkb stale) and docs ingestion (track_docs = true).
# Schema: docs/AUTHORING.md. version = major.minor of crates.io max_stable_version, verified 2026-09-29.
#
# tier:  default     = pick this unless you have a stated reason not to
#        recommended = good, maintained choice for the stated use_for
#        situational = only for the specific use_for case
#        avoid       = deprecated / unmaintained / superseded by std; see alternatives
#
# Allowed category values:
#   async-runtime    executors/runtimes
#   async-util       futures, cancellation, retries
#   web              server frameworks & middleware
#   http             HTTP types, low-level HTTP, URLs, WebSockets
#   rpc              gRPC
#   serialization    serde and data formats
#   http-client      HTTP/SMTP clients
#   database         SQL/NoSQL clients, ORMs, embedded stores
#   cache            in-memory caches
#   cli              argument parsing & terminal UX
#   tui              terminal UIs
#   error            error types & reporting
#   observability    logs, traces, metrics
#   config           configuration loading
#   time             dates, times, time zones
#   text             regex, unicode, markdown, templates
#   parsing          parser combinators/generators, lexers
#   concurrency      threads, parallelism, locks, lazy statics
#   data-structures  collections, ids, randomness, derive helpers
#   testing          test & bench libraries
#   tls              TLS stacks & certificates
#   crypto           cryptographic primitives & secrets
#   gui              desktop GUI, graphics, games
#   wasm             WebAssembly (browser & runtimes)
#   embedded         no_std / microcontrollers
#   data             dataframes, arrays, math, images
#   ml               machine learning & AI protocols
#   ffi              foreign-function interfaces & bindings
#   fs               filesystem walking/watching
#   compression      compression & archives
#   os               OS APIs
#   messaging        message brokers
#   cloud            cloud SDKs & object storage
#   macros           proc-macro tooling & macro helpers
#   tool             cargo subcommands / dev tools (install, do not depend on)

# ======================================================================
# async-runtime: executors/runtimes
# ======================================================================

[[crate]]
name = "tokio"
category = "async-runtime"
tier = "default"
version = "1.53"
summary = "Multi-threaded async runtime with IO, timers, sync primitives; the ecosystem default."
use_for = "Any async application: servers, clients, CLIs doing concurrent IO."
avoid_when = "Pure CPU-bound work (use rayon) or embedded/no_std (use embassy)."
alternatives = ["smol", "embassy-executor"]
replaces = ["async-std", "tokio-core"]
track_docs = true

[[crate]]
name = "smol"
category = "async-runtime"
tier = "situational"
version = "2.0"
summary = "Small, simple async runtime built from async-io/async-executor/blocking."
use_for = "Small tools or libraries wanting a minimal runtime; replacement for discontinued async-std."
avoid_when = "You need the tokio ecosystem (axum, tonic, sqlx, reqwest all assume tokio)."
alternatives = ["tokio"]
replaces = ["async-std"]
track_docs = false

[[crate]]
name = "async-std"
category = "async-runtime"
tier = "avoid"
version = "1.13"
summary = "Discontinued async runtime (RUSTSEC-2025-0052); authors point to smol."
use_for = "Nothing new."
avoid_when = "Always: tokio, or smol for minimal runtimes."
alternatives = ["tokio", "smol"]
replaces = []
track_docs = false

