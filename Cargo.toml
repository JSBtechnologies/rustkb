[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/JSBtechnologies/rustkb"
homepage = "https://github.com/JSBtechnologies/rustkb"
authors = ["Jeffrie Budde"]

[workspace.dependencies]
rustkb-core = { path = "crates/rustkb-core", version = "0.2.0" }
rustkb-index = { path = "crates/rustkb-index", version = "0.2.0" }
rustkb-ingest = { path = "crates/rustkb-ingest", version = "0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
# Purely stylistic pedantic lints allowed workspace-wide; see task notes for rationale.
too_many_lines = "allow"
# RRF rank -> f32 and similar small-value conversions are fine to lose precision on.
cast_precision_loss = "allow"
struct_field_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
