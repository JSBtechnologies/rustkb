[package]
name = "rustkb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.37"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
rustkb-core.workspace = true
rustkb-index.workspace = true
rustkb-ingest.workspace = true
schemars = "1.2.2"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[lints]
workspace = true

[features]
semantic = ["rustkb-index/semantic"]
